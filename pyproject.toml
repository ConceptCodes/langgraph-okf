[project]
name = "langgraph-okf"
version = "0.1.0"
description = "An example of a LangGraph agent that uses Google's OKF consumer spec"
readme = "README.md"
authors = [
    { name = "David Ojo", email = "conceptcodes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "pydantic>=2.10.0",
    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
]

[project.urls]
Homepage = "https://github.com/ConceptCodes/langgraph-okf"
Repository = "https://github.com/ConceptCodes/langgraph-okf"
Issues = "https://github.com/ConceptCodes/langgraph-okf/issues"

[project.scripts]
langgraph-okf = "langgraph_okf:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
